<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title01 desc01">
  <title id="title01">Sensor, processing and actuator loop</title>
  <desc id="desc01">A closed loop diagram: Sensors feed data into Processing, Processing sends commands to Actuators, Actuators change the World, and the World is observed again by Sensors, closing the loop. Power flows from a Battery to all three blocks, shown as dashed lines. An Emergency Stop can cut power to Actuators directly.</desc>
  <defs>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowPower01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="380" fill="#fbfcfc" stroke="#d7dee1" stroke-width="1"/>

  <!-- World (top) -->
  <rect x="300" y="20" width="200" height="60" rx="8" fill="#eef2f3" stroke="#6b7780" stroke-width="1.5"/>
  <text x="400" y="55" text-anchor="middle" font-size="18" fill="#23292d" font-weight="600">World</text>

  <!-- Sensors (left) -->
  <rect x="60" y="150" width="190" height="80" rx="8" fill="#e3f7f6" stroke="#00918d" stroke-width="1.5"/>
  <text x="155" y="182" text-anchor="middle" font-size="18" fill="#23292d" font-weight="600">Sensors</text>
  <text x="155" y="205" text-anchor="middle" font-size="13" fill="#5f6b70">LiDAR, camera, IMU,</text>
  <text x="155" y="221" text-anchor="middle" font-size="13" fill="#5f6b70">encoders, bumpers</text>

  <!-- Processing (center) -->
  <rect x="305" y="150" width="190" height="80" rx="8" fill="#e3f7f6" stroke="#00918d" stroke-width="1.5"/>
  <text x="400" y="182" text-anchor="middle" font-size="18" fill="#23292d" font-weight="600">Processing</text>
  <text x="400" y="205" text-anchor="middle" font-size="13" fill="#5f6b70">Onboard computer,</text>
  <text x="400" y="221" text-anchor="middle" font-size="13" fill="#5f6b70">ROS 2 nodes</text>

  <!-- Actuators (right) -->
  <rect x="550" y="150" width="190" height="80" rx="8" fill="#e3f7f6" stroke="#00918d" stroke-width="1.5"/>
  <text x="645" y="182" text-anchor="middle" font-size="18" fill="#23292d" font-weight="600">Actuators</text>
  <text x="645" y="205" text-anchor="middle" font-size="13" fill="#5f6b70">Motor controllers,</text>
  <text x="645" y="221" text-anchor="middle" font-size="13" fill="#5f6b70">gripper, arm</text>

  <!-- data path: Sensors -> Processing -->
  <path d="M250,190 H305" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow01)"/>
  <text x="277" y="180" text-anchor="middle" font-size="12" fill="#2b6cb0">measurements</text>

  <!-- data path: Processing -> Actuators -->
  <path d="M495,190 H550" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow01)"/>
  <text x="522" y="180" text-anchor="middle" font-size="12" fill="#2b6cb0">commands</text>

  <!-- Actuators -> World -->
  <path d="M645,150 C645,100 500,80 470,80" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow01)"/>
  <text x="610" y="105" text-anchor="middle" font-size="12" fill="#2b6cb0">acts on</text>

  <!-- World -> Sensors -->
  <path d="M330,80 C300,80 155,100 155,150" fill="none" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow01)"/>
  <text x="220" y="105" text-anchor="middle" font-size="12" fill="#2b6cb0">observes</text>

  <!-- Battery + power -->
  <rect x="325" y="300" width="150" height="50" rx="8" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.5"/>
  <text x="400" y="330" text-anchor="middle" font-size="16" fill="#23292d" font-weight="600">Battery</text>

  <path d="M325,320 L155,300 L155,230" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPower01)"/>
  <path d="M400,300 V230" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPower01)"/>
  <path d="M475,320 L645,300 L645,230" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPower01)"/>
  <text x="400" y="285" text-anchor="middle" font-size="12" fill="#b7791f">power (dashed, battery → every block)</text>

  <!-- E-stop -->
  <rect x="600" y="300" width="150" height="50" rx="8" fill="#fbe9e7" stroke="#c53030" stroke-width="1.5"/>
  <text x="675" y="330" text-anchor="middle" font-size="15" fill="#23292d" font-weight="600">E-Stop</text>
  <path d="M675,300 V255" fill="none" stroke="#c53030" stroke-width="2.5" marker-end="url(#arrowPower01)"/>
  <text x="705" y="270" text-anchor="middle" font-size="11" fill="#c53030">cuts power</text>
</svg>
