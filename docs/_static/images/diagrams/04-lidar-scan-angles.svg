<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title04 desc04">
  <title id="title04">LiDAR scan and its angle range</title>
  <desc id="desc04">A robot sits at the centre of a fan of laser rays. The rays sweep from angle_min on the right side, through straight ahead at angle zero, to angle_max on the left side, with angle_increment being the small step between neighbouring rays. Two example rays are drawn hitting a wall, with their measured range labelled. A ray pointing at open space is drawn extending to range_max and labelled infinite, meaning no obstacle was detected within range.</desc>

  <rect x="0" y="0" width="800" height="460" fill="#fbfcfc" stroke="#d7dee1" stroke-width="1"/>

  <!-- wall arc -->
  <path d="M120,120 A320,320 0 0 1 680,120" fill="none" stroke="#6b7780" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#5f6b70">wall / obstacle</text>

  <!-- rays -->
  <g stroke="#2b6cb0" stroke-width="1" opacity="0.55">
    <line x1="400" y1="330" x2="140" y2="140"/>
    <line x1="400" y1="330" x2="185" y2="105"/>
    <line x1="400" y1="330" x2="235" y2="80"/>
    <line x1="400" y1="330" x2="290" y2="63"/>
    <line x1="400" y1="330" x2="350" y2="52"/>
    <line x1="400" y1="330" x2="400" y2="48"/>
    <line x1="400" y1="330" x2="450" y2="52"/>
    <line x1="400" y1="330" x2="510" y2="63"/>
    <line x1="400" y1="330" x2="565" y2="80"/>
    <line x1="400" y1="330" x2="615" y2="105"/>
    <line x1="400" y1="330" x2="660" y2="140"/>
  </g>

  <!-- highlighted example rays -->
  <line x1="400" y1="330" x2="660" y2="140" stroke="#00918d" stroke-width="2.5"/>
  <circle cx="660" cy="140" r="5" fill="#00918d"/>
  <text x="640" y="170" text-anchor="end" font-size="12" fill="#00918d" font-weight="600">angle_min</text>
  <text x="655" y="120" text-anchor="middle" font-size="11" fill="#00918d">range ≈ 2.4 m</text>

  <line x1="400" y1="330" x2="140" y2="140" stroke="#00918d" stroke-width="2.5"/>
  <circle cx="140" cy="140" r="5" fill="#00918d"/>
  <text x="160" y="170" text-anchor="start" font-size="12" fill="#00918d" font-weight="600">angle_max</text>

  <line x1="400" y1="330" x2="400" y2="48" stroke="#b7791f" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="400" y="35" text-anchor="middle" font-size="12" fill="#b7791f">angle = 0 (straight ahead)</text>

  <!-- open-space ray to range_max -->
  <line x1="400" y1="330" x2="290" y2="63" stroke="#c53030" stroke-width="2"/>
  <text x="260" y="55" text-anchor="middle" font-size="11" fill="#c53030">.inf (no return within range_max)</text>

  <!-- increment callout -->
  <path d="M450,52 A70,70 0 0 1 510,63" fill="none" stroke="#5f6b70" stroke-width="1.2"/>
  <text x="500" y="45" font-size="11" fill="#5f6b70">angle_increment</text>

  <!-- robot -->
  <circle cx="400" cy="330" r="34" fill="#e3f7f6" stroke="#00918d" stroke-width="2.5"/>
  <text x="400" y="336" text-anchor="middle" font-size="13" fill="#23292d" font-weight="700">robot</text>

  <!-- legend / message fields -->
  <rect x="60" y="380" width="680" height="65" rx="8" fill="#eef2f3" stroke="#6b7780" stroke-width="1.2"/>
  <text x="80" y="404" font-size="13" fill="#23292d" font-weight="600">sensor_msgs/msg/LaserScan</text>
  <text x="80" y="424" font-size="12" fill="#5f6b70">ranges[i] is measured at angle = angle_min + i × angle_increment</text>
  <text x="80" y="440" font-size="12" fill="#5f6b70">range_min / range_max bound what counts as a valid measurement</text>
</svg>
