name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  examples:
    name: Build and test the example ROS 2 packages
    # Independent of the Sphinx build/deploy below: this never blocks or
    # delays publishing the site, it only checks that the example package(s)
    # referenced from the course pages actually build under ROS 2 Humble.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Build and test turtle_course (module 2)
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: turtle_course
          target-ros2-distro: humble
          # The package lives under examples/, not the repository root --
          # colcon needs to be told where to find it.
          colcon-defaults: |
            {
              "build": { "base-paths": ["examples/module02_turtlesim/turtle_course"] },
              "test": { "base-paths": ["examples/module02_turtlesim/turtle_course"] }
            }

  build:
    name: Build the Sphinx site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site
        # -W turns warnings into errors, so a broken link or a bad
        # cross-reference fails the build instead of shipping quietly.
        # --keep-going reports every problem in one run rather than the first.
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check that no secrets reached the output
        # Cheap safety net: the repository is public, and the source material
        # this site was built from contained cleartext credentials and signed
        # URLs. See SECURITY_REVIEW.md.
        #
        # The credential pattern is applied to the generated content pages
        # only. Scanning _static/ as well produces false positives from
        # third-party assets -- Font Awesome ships a `.fa-user-secret:before`
        # rule that matches any naive "secret:" pattern.
        run: |
          set -e
          echo "Scanning build output for secrets and internal data..."
          fail=0

          echo "-> signed / tokenised URLs (whole output)"
          if grep -rEn 'X-Amz-|Signature=|[?&]jwt=|[?&]token=' \
               docs/_build/html; then
            echo "::error::Signed or tokenised URL found in the build output"
            fail=1
          fi

          echo "-> private key material (whole output)"
          if grep -rEn 'BEGIN [A-Z ]*PRIVATE KEY|ssh-rsa AAAA|ssh-ed25519 AAAA' \
               docs/_build/html; then
            echo "::error::Private key material found in the build output"
            fail=1
          fi

          echo "-> credentials (generated content pages)"
          if grep -rEn --include='*.html' \
               '(password|passwd|secret|api[_-]?key|token|credential)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]{6,}' \
               docs/_build/html; then
            echo "::error::Possible credential found in the generated pages"
            fail=1
          fi

          echo "-> internal hosts and private repositories (content pages)"
          if grep -rEn --include='*.html' \
               'git\.fh-aachen\.de|private-user-images\.githubusercontent\.com' \
               docs/_build/html; then
            echo "::error::Internal host or private image URL found"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no secrets found in the build output."

      - name: Check external links
        # Informational only. Internal links and images are already validated
        # by the `-W` build above; this step checks that external URLs still
        # resolve. External sites go down, rate-limit and block CI runners, so
        # it must never be the reason a deploy fails -- and it must never hang:
        # a single slow host can otherwise stall the job for hours.
        timeout-minutes: 6
        continue-on-error: true
        run: |
          timeout 300 sphinx-build -b linkcheck docs docs/_build/linkcheck \
            || echo "linkcheck did not finish cleanly (informational only)"
          echo "--- linkcheck summary ---"
          if [ -s docs/_build/linkcheck/output.txt ]; then
            cat docs/_build/linkcheck/output.txt
          else
            echo "No broken links reported."
          fi

      - name: Upload the Pages artifact
        # Only the deploy job needs the artifact, but uploading on pull
        # requests too confirms the artifact step itself works.
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy from main -- pull requests build but never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
