name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the Sphinx site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site
        # -W turns warnings into errors, so a broken link or a bad
        # cross-reference fails the build instead of shipping quietly.
        # --keep-going reports every problem in one run rather than the first.
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check that no secrets reached the output
        # Cheap safety net: the repository is public, and the source material
        # this site was built from contained credentials and signed URLs.
        run: |
          set -e
          echo "Scanning built HTML for secrets and internal data..."

          if grep -rEn 'X-Amz-|Signature=|[?&]jwt=|[?&]token=' \
               docs/_build/html; then
            echo "::error::Signed or tokenised URL found in the build output"
            exit 1
          fi

          if grep -rEn 'BEGIN [A-Z ]*PRIVATE KEY|ssh-rsa AAAA|ssh-ed25519 AAAA' \
               docs/_build/html; then
            echo "::error::Private key material found in the build output"
            exit 1
          fi

          if grep -rEn '(password|passwd|secret|api[_-]?key|token|credential)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_.-]{6,}' \
               docs/_build/html; then
            echo "::error::Possible credential found in the build output"
            exit 1
          fi

          echo "No secrets found in the build output."

      - name: Check internal links and images
        # linkcheck also validates external URLs, which makes it flaky in CI,
        # so external failures are reported but do not fail the build.
        run: |
          sphinx-build -b linkcheck docs docs/_build/linkcheck || true
          echo "--- linkcheck summary ---"
          if [ -f docs/_build/linkcheck/output.txt ]; then
            cat docs/_build/linkcheck/output.txt
          else
            echo "No broken links reported."
          fi
        continue-on-error: true

      - name: Upload the Pages artifact
        # Only the deploy job needs the artifact, but uploading on pull
        # requests too confirms the artifact step itself works.
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy from main -- pull requests build but never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
